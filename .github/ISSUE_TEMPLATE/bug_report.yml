name: 🐛 버그 리포트
description: 원인을 모르는 버그를 신고할 때 사용하세요 (원인과 수정 방법을 이미 안다면 🛠️ Fix를 사용해주세요)
title: "[bug] "
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: 🐛 버그 설명
      description: 어떤 버그인지 설명해주세요.
      placeholder: 예) 지수 정보 등록 시 즐겨찾기 값이 저장되지 않습니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 재현 방법
      description: 버그를 재현할 수 있는 단계를 순서대로 작성해주세요.
      placeholder: |
        1. /indexes API 호출
        2. 특정 값 입력
        3. 에러 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✅ 예상 동작
      description: 원래 어떻게 동작해야 하는지 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 동작
      description: 실제로 어떻게 동작했는지 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 📷 스크린샷/로그 (선택)
      description: 관련 스크린샷이나 에러 로그를 첨부해주세요.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 💻 환경
      description: OS, 실행 환경 등
      placeholder: 예) macOS, 로컬 환경
    validations:
      required: false