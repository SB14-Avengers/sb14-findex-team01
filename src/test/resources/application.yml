spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

# 테스트에서는 외부 Open API를 실제로 호출하지 않으므로 더미 값만 주입 (Open API 연동 구현 시 @Value 해석용)
PUBLIC_API_SERVICE_KEY: test-service-key

# 메인 application.yml(findex.openapi.uri)은 테스트 클래스패스에서 로드되지 않아 별도로 더미 값 필요
findex:
  openapi:
    uri: http://localhost/dummy-openapi-uri