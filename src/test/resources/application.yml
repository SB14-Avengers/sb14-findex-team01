spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

# 테스트에서는 외부 Open API를 실제로 호출하지 않으므로 더미 값만 주입 (Open API 연동 구현 시 @Value 해석용)
# OPENAPI_URI는 비밀이 아니라 application.yml(findex.openapi.uri)에 고정값으로 있어 여기 없음
PUBLIC_API_SERVICE_KEY: test-service-key